<!doctype html>
<html lang="es-CL" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Monitor · Balance DMH</title>
  <meta name="description" content="Monitor de balance hídrico de la barrera de auscultación DMH (División Ministro Hales, Calama). Simulacro académico con datos de la tesis.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <strong>Barrera de auscultación DMH</strong>
        <span>División Ministro Hales · Codelco · Calama</span>
      </div>
      <div id="status-pill" class="status-pill" role="status" aria-live="off"></div>
    </div>
    <p class="sim-banner"><span aria-hidden="true">ⓘ</span> Simulacro académico · datos simulados y de la tesis</p>
  </header>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#monitor" data-tab="monitor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg><span>Monitor</span></a>
    <a href="#calculadora" data-tab="calculadora"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg><span>Calculadora</span></a>
    <a href="#balance" data-tab="balance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg><span>Balance</span></a>
    <a href="#historial" data-tab="historial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8"/><path d="M3 21h18"/></svg><span>Historial</span></a>
    <a href="#ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Ajustes</span></a>
  </nav>

  <main id="main" tabindex="-1"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="presentation" class="presentation" role="dialog" aria-modal="true" aria-label="Modo presentación" hidden>
    <button type="button" class="p-close icon-btn" aria-label="Cerrar modo presentación">✕</button>
    <p class="eyebrow">Monitor de balance hídrico DMH</p>
    <div class="p-gauge" data-b="p-gauge"></div>
    <div class="p-badge" data-b="p-badge"></div>
    <p class="small muted">Presiona Esc o la ✕ para salir</p>
  </div>

  <noscript><p class="noscript">Esta app necesita JavaScript activado en el navegador.</p></noscript>
</body>
</html>
